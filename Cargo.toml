[package]
name = "cronsim"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
croner = { version = "4.0.2", default-features = false, features = ["jiff"] }
jiff = "0.2.38"
rustix = { version = "1.1.5", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.5"
time = { version = "0.3.55", default-features = false, features = ["formatting", "parsing", "serde", "std"] }
toml = "1.1.8"

[dev-dependencies]
assert_cmd = "2.2.2"
jiff = { version = "0.2.38", features = ["tzdb-bundle-always"] }
predicates = "3.1.4"
tempfile = "3.27.0"
